app:
  name: yomi-admin-backend
  env: dev
  version: v0.1.0
  timezone: UTC

http:
  port: 8080
  router_prefix: /api
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  read_header_timeout_seconds: 5
  idle_timeout_seconds: 90
  shutdown_timeout_seconds: 10
  max_request_body_bytes: 1048576

masking:
  placeholder: "***"
  match: contains
  rules:
    - keys: [password, passwd, old_password, new_password, token, access_token, refresh_token, secret, api_key]
      strategy: redact
    - keys: [authorization, cookie, set-cookie]
      strategy: redact
    - keys: [phone, mobile]
      strategy: phone
    - keys: [email]
      strategy: email

log:
  dir: logs
  level: info
  console_enabled: true
  mask_sensitive: true
  rotation:
    max_size_mb: 50
    retention_days: 3
    max_backups: 30
    max_total_mb: 2048
  access:
    record_body: true
    max_body_bytes: 8192
    skip_paths:
      - /api/v1/health
      - /api/v1/health/ops

cors:
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "OPTIONS"]
  allow_headers: ["Authorization", "Content-Type", "X-Trace-ID"]
  allow_credentials: false

db:
  enabled: true
  type: mysql
  host: 127.0.0.1
  port: 3306
  user: root
  password: "hww350521"
  database: yomi_admin
  params: "charset=utf8mb4&parseTime=True&loc=UTC&time_zone=%27%2B00%3A00%27"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_minutes: 60
  conn_max_idle_time_minutes: 30

redis:
  enabled: true
  addr: 127.0.0.1:6379
  password: "hww350521"
  db: 0

# 调用式限流：验证码生成按 IP 限制刷新频率
ratelimit:
  enabled: true
  key_prefix: yomi:rl
  redis_error_policy: fail_closed

token:
  enabled: true
  token_ttl_minutes: 120
  store_prefix: "yomi:token:yomi-admin"
  allow_multi_login: true
  # 免令牌路由统一声明在 biz.auth.public_paths（token: false），启动时注入本段

snowflake:
  worker_id: 1

# 业务配置段
biz:
  captcha:
    enabled: ${YOMI_ADMIN_BIZ_CAPTCHA_ENABLED:true}
    driver: digit
    length: 4
    width: 160
    height: 60
    ttl_seconds: 180
    key_prefix: yomi:captcha:login
    # 验证码一次性：登录失败后前端会立刻换图，间隔必须很短，否则换图被限流拒绝、页面停在已作废的验证码上
    refresh_interval_seconds: 1
  # 登录防爆破：IP 尝试配额 + IP/账号失败预算 + 临时锁定
  login_guard:
    enabled: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_ENABLED:true}
    key_prefix: yomi:admin:loginguard
    ip_max_attempts: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_IP_MAX_ATTEMPTS:20}
    ip_window_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_IP_WINDOW_SECONDS:300}
    ip_max_failures: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_IP_MAX_FAILURES:10}
    ip_fail_window_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_IP_FAIL_WINDOW_SECONDS:900}
    ip_lock_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_IP_LOCK_SECONDS:600}
    pair_max_failures: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_PAIR_MAX_FAILURES:5}
    pair_window_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_PAIR_WINDOW_SECONDS:600}
    pair_lock_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_PAIR_LOCK_SECONDS:600}
    account_max_failures: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_ACCOUNT_MAX_FAILURES:10}
    account_window_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_ACCOUNT_WINDOW_SECONDS:300} # 必须小于 pair_lock_seconds，避免单个 IP 触发账号锁
    account_lock_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_ACCOUNT_LOCK_SECONDS:900}
    account_max_lock_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_ACCOUNT_MAX_LOCK_SECONDS:3600}
    level_ttl_seconds: ${YOMI_ADMIN_BIZ_LOGIN_GUARD_LEVEL_TTL_SECONDS:86400}
  rbac:
    cache:
      enabled: ${YOMI_ADMIN_BIZ_RBAC_CACHE_ENABLED:true}
      key: yomi:admin:rbac:projection
      lock_key: yomi:admin:rbac:projection:lock
      bootstrap_warmup: ${YOMI_ADMIN_BIZ_RBAC_CACHE_BOOTSTRAP_WARMUP:true} # 启动时仅当投影不可用才重建
      refresh_interval_seconds: ${YOMI_ADMIN_BIZ_RBAC_CACHE_REFRESH_INTERVAL_SECONDS:60} # 兜底全量重建间隔（秒），0 表示关闭
      projection_max_bytes: 8388608
      lock_wait_seconds: 2
      memory_sync_seconds: ${YOMI_ADMIN_BIZ_RBAC_CACHE_MEMORY_SYNC_SECONDS:5} # 内存快照同步周期（秒），0 表示关闭内存层
  # API 文档（Swagger UI）；开发环境默认开启，生产建议关闭
  docs:
    enabled: ${YOMI_ADMIN_BIZ_DOCS_ENABLED:true}

  # 公开路由：免令牌 / 免接口权限的路由只在这里声明，代码里不再硬编码。
  # path 省略 http.router_prefix（启动时自动拼接）；token=false 表示连令牌都不校验。
  auth:
    public_paths:
      # 完全公开：不校验令牌，也不校验接口权限
      - { method: GET, path: /v1/health, token: false }
      - { method: GET, path: /v1/health/ops, token: false }
      - { method: GET, path: /auth/captcha, token: false }
      - { method: POST, path: /auth/login, token: false }
      # API 文档（Swagger UI 与静态资源）；docs 关闭时这里只是无效声明
      - { method: GET, path: /system/api-doc, token: false }
      - { method: GET, path: /system/api-doc/schema, token: false }
      - { method: GET, path: /system/api-doc/swagger-ui.css, token: false }
      - { method: GET, path: /system/api-doc/swagger-ui-bundle.js, token: false }
      # 登录即可：校验令牌，但不校验接口权限
      - { method: GET, path: /auth/profile, token: true }
      - { method: POST, path: /auth/logout, token: true }
      - { method: POST, path: /auth/password, token: true }

# HTTP 访问记录：中间件采集 + 进程内消费者落库，供后台「访问记录」页面查询
http_record:
  enabled: true
  provider: memory
  skip_paths:
    - /api/v1/health
    - /api/v1/health/ops
  max_request_body_size: 4096
  max_response_body_size: 8192
  record_request_body: true
  record_response_body: true
  mask_sensitive: true
  memory:
    queue_size: 2048
    workers: 4
  consumer: # kafka / redis_stream 生效；memory 恒消费，enabled 只影响其余两种 provider
    enabled: true
    group_id: yomi-admin-httprecord # 留空时按 app.name + "-httprecord" 派生
    max_retry: 3 # kafka：同一记录最大重试次数，超限直接丢弃；0 表示不重试
