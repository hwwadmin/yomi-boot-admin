app:
  name: yomi-admin-backend
  env: dev
  version: v0.1.0
  timezone: UTC

http:
  port: 8080
  router_prefix: /api
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  read_header_timeout_seconds: 5
  idle_timeout_seconds: 90
  shutdown_timeout_seconds: 10
  max_request_body_bytes: 1048576

masking:
  placeholder: "***"
  match: contains
  rules:
    - keys: [password, passwd, old_password, new_password, token, access_token, refresh_token, secret, api_key]
      strategy: redact
    - keys: [authorization, cookie, set-cookie]
      strategy: redact
    - keys: [phone, mobile]
      strategy: phone
    - keys: [email]
      strategy: email

log:
  dir: logs
  level: info
  console_enabled: true
  mask_sensitive: true
  rotation:
    max_size_mb: 50
    retention_days: 3
    max_backups: 30
    max_total_mb: 2048
  access:
    record_body: true
    max_body_bytes: 8192
    skip_paths:
      - /api/v1/health
      - /api/v1/health/ops

cors:
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Authorization", "Content-Type", "X-Trace-ID"]
  allow_credentials: false

db:
  enabled: true
  type: mysql
  host: 127.0.0.1
  port: 3306
  user: root
  password: "hww350521"
  database: yomi_admin
  params: "charset=utf8mb4&parseTime=True&loc=UTC&time_zone=%27%2B00%3A00%27"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime_minutes: 60
  conn_max_idle_time_minutes: 30

redis:
  enabled: true
  addr: 127.0.0.1:6379
  password: "hww350521"
  db: 0

token:
  enabled: true
  token_ttl_minutes: 120
  store_prefix: "yomi:token:yomi-admin"
  allow_multi_login: true
  skip_validate_paths:
    - /api/v1/health
    - /api/v1/health/ops
    - /api/auth/login

snowflake:
  worker_id: 1

# HTTP 访问记录：中间件采集 + 进程内消费者落库，供后台「访问记录」页面查询
http_record:
  enabled: true
  provider: memory
  skip_paths:
    - /api/v1/health
    - /api/v1/health/ops
  max_request_body_size: 4096
  max_response_body_size: 8192
  record_request_body: true
  record_response_body: true
  mask_sensitive: true
  memory:
    queue_size: 2048
    workers: 4
  consumer: # kafka / redis_stream 时生效；memory 由本进程直接消费
    enabled: true
    group_id: yomi-admin-httprecord
