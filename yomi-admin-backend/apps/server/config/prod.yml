app:
  name: yomi-admin-backend
  env: prod
  version: v0.1.0
  timezone: UTC

http:
  port: 8080
  router_prefix: /api
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  read_header_timeout_seconds: 5
  idle_timeout_seconds: 90
  shutdown_timeout_seconds: 10
  max_request_body_bytes: 1048576

log:
  dir: logs
  level: info
  console_enabled: false
  mask_sensitive: true
  rotation:
    max_size_mb: 100
    retention_days: 7
    max_backups: 30
    max_total_mb: 4096
  access:
    record_body: false
    max_body_bytes: 8192
    skip_paths:
      - /api/v1/health
      - /api/v1/health/ops

cors:
  allow_origins: ["https://admin.example.com"]
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Authorization", "Content-Type", "X-Trace-ID"]
  allow_credentials: false

db:
  enabled: true
  type: mysql
  host: 127.0.0.1
  port: 3306
  user: root
  password: "${YOMI_ADMIN_DB_PASSWORD:change-me}"
  database: yomi_admin
  params: "charset=utf8mb4&parseTime=True&loc=UTC&time_zone=%27%2B00%3A00%27"
  max_open_conns: 50
  max_idle_conns: 20
  conn_max_lifetime_minutes: 60
  conn_max_idle_time_minutes: 30

redis:
  enabled: true
  addr: 127.0.0.1:6379
  password: "${YOMI_ADMIN_REDIS_PASSWORD:}"
  db: 0

token:
  enabled: true
  token_ttl_minutes: 120
  store_prefix: "yomi:token:yomi-admin"
  allow_multi_login: true
  skip_validate_paths:
    - /api/v1/health
    - /api/v1/health/ops
    - /api/auth/login

snowflake:
  worker_id: 1
