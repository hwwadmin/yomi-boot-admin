<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" fill="none" role="img" aria-label="欢迎">
  <defs>
    <linearGradient id="welcomePrimary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#66B1FF"/>
      <stop offset="1" stop-color="#409EFF"/>
    </linearGradient>
    <linearGradient id="welcomeGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#95D475"/>
      <stop offset="1" stop-color="#67C23A"/>
    </linearGradient>
    <linearGradient id="welcomeScreen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F4FAFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="welcomeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#409EFF" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 背景装饰 -->
  <circle cx="298" cy="46" r="62" fill="#409EFF" opacity="0.07"/>
  <circle cx="330" cy="148" r="40" fill="#67C23A" opacity="0.10"/>
  <circle cx="38" cy="152" r="16" stroke="#409EFF" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M34 44v16M26 52h16" stroke="#409EFF" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="338" cy="84" r="3" fill="#E6A23C" opacity="0.8"/>
  <circle cx="24" cy="104" r="3.5" fill="#409EFF" opacity="0.6"/>

  <!-- 主面板 -->
  <g filter="url(#welcomeShadow)">
    <rect x="52" y="22" width="210" height="136" rx="14" fill="url(#welcomeScreen)" stroke="#D9ECFF" stroke-width="1.5"/>
  </g>

  <!-- 侧边栏 -->
  <path d="M66 22h34v136H66c-7.73 0-14-6.27-14-14V36c0-7.73 6.27-14 14-14Z" fill="#F0F7FF"/>
  <rect x="62" y="38" width="28" height="8" rx="4" fill="#409EFF" opacity="0.35"/>
  <rect x="62" y="56" width="22" height="7" rx="3.5" fill="#C0C4CC" opacity="0.55"/>
  <rect x="62" y="72" width="26" height="7" rx="3.5" fill="#C0C4CC" opacity="0.55"/>
  <rect x="62" y="88" width="18" height="7" rx="3.5" fill="#C0C4CC" opacity="0.55"/>

  <!-- 主内容：标题 -->
  <rect x="108" y="38" width="72" height="9" rx="4.5" fill="#303133" opacity="0.72"/>
  <rect x="108" y="54" width="48" height="6" rx="3" fill="#C0C4CC" opacity="0.55"/>

  <!-- 柱状图 -->
  <rect x="108" y="110" width="16" height="30" rx="4" fill="#409EFF" opacity="0.25"/>
  <rect x="132" y="94" width="16" height="46" rx="4" fill="#409EFF" opacity="0.45"/>
  <rect x="156" y="102" width="16" height="38" rx="4" fill="#409EFF" opacity="0.62"/>
  <rect x="180" y="82" width="16" height="58" rx="4" fill="url(#welcomePrimary)"/>
  <rect x="204" y="90" width="16" height="50" rx="4" fill="#67C23A" opacity="0.45"/>
  <rect x="228" y="100" width="16" height="40" rx="4" fill="#67C23A" opacity="0.25"/>

  <!-- 悬浮趋势卡 -->
  <g filter="url(#welcomeShadow)">
    <rect x="246" y="100" width="94" height="58" rx="10" fill="#FFFFFF" stroke="#E4F0FF" stroke-width="1"/>
  </g>
  <rect x="258" y="110" width="28" height="5" rx="2.5" fill="#C0C4CC" opacity="0.6"/>
  <polyline
    points="258,146 272,134 286,140 300,124 314,130 328,116"
    stroke="url(#welcomeGreen)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="328" cy="116" r="3.5" fill="#67C23A" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 用户徽章 -->
  <g filter="url(#welcomeShadow)">
    <circle cx="314" cy="42" r="24" fill="#FFFFFF" stroke="#E4F0FF" stroke-width="1"/>
  </g>
  <circle cx="314" cy="35" r="6.5" fill="url(#welcomePrimary)"/>
  <path d="M301 56c0-7.18 5.82-13 13-13s13 5.82 13 13Z" fill="url(#welcomePrimary)"/>
  <circle cx="330" cy="58" r="8" fill="#67C23A" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M326.5 58l2.5 2.5 4.5-4.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
